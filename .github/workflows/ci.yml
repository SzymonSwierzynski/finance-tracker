name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # `build` runs Spotless, unit + slice + Testcontainers integration tests,
      # Flyway validation and the JaCoCo coverage gate. Docker is preinstalled on
      # ubuntu runners, which Testcontainers needs.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `build` runs the TypeScript project typecheck (`tsc -b`) and then the Vite production bundle,
      # so it doubles as the typecheck gate.
      - name: Build
        run: npm run build

      # Gate on vulnerabilities in shipped (production) dependencies only. Dev-only tooling — e.g. the
      # OpenAPI type generator — carries advisories that never reach the bundle, so they must not
      # block every PR. Tighten to include dev deps once that tree is clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
