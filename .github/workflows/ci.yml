name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # `build` runs Spotless, unit + slice + Testcontainers integration tests,
      # Flyway validation and the JaCoCo coverage gate. Docker is preinstalled on
      # ubuntu runners, which Testcontainers needs.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `build` runs the TypeScript project typecheck (`tsc -b`) and then the Vite production bundle,
      # so it doubles as the typecheck gate.
      - name: Build
        run: npm run build

      # Gate on vulnerabilities in shipped (production) dependencies only. Dev-only tooling — e.g. the
      # OpenAPI type generator — carries advisories that never reach the bundle, so they must not
      # block every PR. Tighten to include dev deps once that tree is clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Playwright drives Chromium against the REAL stack (SPA → Vite proxy → Spring Boot → Postgres),
    # translating the local recipe in HANDOFF §5. The rate limiter is disabled so the many
    # registrations from one loopback address don't 429 the suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U finance -d finance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Launch the backend in the background; the next step waits for it to report healthy.
      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finance
          SPRING_DATASOURCE_USERNAME: finance
          SPRING_DATASOURCE_PASSWORD: finance
          APP_RATE_LIMIT_ENABLED: "false"
        run: nohup ./gradlew bootRun --no-daemon > backend.log 2>&1 &

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health >/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy in time"; exit 1

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: npm run e2e

      - name: Dump backend log on failure
        if: failure()
        run: cat backend/backend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
