spring:
  application:
    name: finance-tracker-backend
  datasource:
    # Dev-friendly defaults; overridden by env in compose/prod, replaced by Testcontainers in tests.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:finance}
    hikari:
      data-source-properties:
        # Send string params as untyped so Postgres coerces them to citext (case-insensitive
        # email comparisons); without this, params bind as varchar and citext compares case-sensitively.
        stringtype: unspecified
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    # Never leak internals to clients; the global handler returns problem+json.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  # Surface `info.*` properties on /actuator/info (off by default since Boot 2.6). This is how the
  # deployed commit becomes queryable at runtime — the only way to prove which code is *executing*
  # rather than which commit was built.
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

# Reported by GET /actuator/info (public). Railway injects RAILWAY_GIT_COMMIT_SHA at build+runtime;
# anywhere else this falls back to "unknown". Lets you confirm the deployed commit without trusting
# the dashboard: curl https://<backend>/actuator/info
info:
  app:
    name: finance-tracker
  git:
    commit: ${RAILWAY_GIT_COMMIT_SHA:unknown}
    branch: ${RAILWAY_GIT_BRANCH:unknown}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    issuer: finance-tracker
    cookie:
      name: refreshToken
      path: /api/v1/auth
      secure: false
      same-site: Lax
    jwt:
      key-id: ft-dev-1
      # private-key / public-key are injected via env in prod; absent -> ephemeral dev key.
    # Nightly purge of refresh tokens that are past expiry (revoked-but-live rows are kept so
    # reuse detection keeps working).
    token-cleanup-cron: "0 15 3 * * *"
  rate-limit:
    # Throttles /auth/{register,login,refresh} per client IP. Per-instance, in-memory: the
    # effective limit multiplies by instance count, so revisit when scaling out horizontally.
    enabled: true
    capacity: 20
    window: 1m
    sweep-interval: PT10M
  cors:
    allowed-origins:
      - http://localhost:5173

logging:
  level:
    root: INFO
  pattern:
    # Surface the per-request correlation id (RequestIdFilter's MDC) in each line; empty off-request.
    level: "%5p [%X{requestId:-}]"
