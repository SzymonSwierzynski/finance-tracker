spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  # Trust X-Forwarded-* from the reverse proxy so Secure cookies / scheme are correct.
  forward-headers-strategy: framework

logging:
  # Structured JSON logs to stdout in prod (12-factor); ECS fields include the requestId MDC.
  structured:
    format:
      console: ecs

springdoc:
  # No public API-docs / Swagger UI in prod — the full contract is a recon aid. Enable it only for
  # CI type-gen (default profile), never on the deployed origin.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    cookie:
      secure: true
      same-site: Lax
    jwt:
      # A stable keypair is REQUIRED in prod (else tokens reset on every restart / per instance).
      key-id: ${APP_AUTH_JWT_KEY_ID:ft-prod-1}
      private-key: ${APP_AUTH_JWT_PRIVATE_KEY}
      public-key: ${APP_AUTH_JWT_PUBLIC_KEY}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
