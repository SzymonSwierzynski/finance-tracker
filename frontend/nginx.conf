# nginx serves the built SPA and reverse-proxies /api to the backend. Serving the app and the API
# from one origin keeps the refresh cookie first-party (SameSite=Lax), exactly like Vite's dev proxy
# — see CLAUDE.md §5 and HANDOFF §21 (3.5b #6). No CORS, no cookie rewriting needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Safe, non-breaking hardening. A strict Content-Security-Policy / HSTS belongs to the
    # TLS-terminating edge in real prod (CLAUDE.md §5) and needs in-browser verification, so it is
    # deliberately left off this http-only demo image.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse-proxy the API to the backend service on the compose network. Resolve the name via
    # Docker's embedded DNS at request time (variable upstream) so nginx boots even before the
    # backend is up and survives a backend restart getting a new container IP. $request_uri keeps the
    # full path (incl. the /api prefix the backend serves under) and the query string intact.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream backend;
        proxy_pass http://$api_upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fingerprinted build assets can be cached hard; they change name on every build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths return index.html so client-side routing survives reloads
    # and deep links (/breakdown, /transactions, …).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
