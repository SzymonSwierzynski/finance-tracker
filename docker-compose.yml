# Local/demo full stack — db + backend + frontend. One command runs everything:
#   docker compose up --build
# The frontend (nginx) serves the SPA and proxies /api to the backend, so the app is same-origin
# and the refresh cookie stays first-party (CLAUDE.md §5). Open http://localhost:5173.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Default profile keeps cookies non-Secure so the demo works over http://localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finance
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance
      # No JWT keypair configured -> an ephemeral key is generated (dev/demo only).
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    # Host 5173 → nginx :80, matching the dev-server port so bookmarks/docs keep working.
    ports:
      - "5173:80"

volumes:
  db-data:
